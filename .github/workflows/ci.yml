name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Integration tests hit 127.0.0.1:27017 (hardcoded in tests/integration/helpers.ts),
      # served by the mongodb container above. The runtime tests (tests/runtime) need a
      # real Firebase service account and stay local-only by design.
      - run: npm run test -w @wedding/api
