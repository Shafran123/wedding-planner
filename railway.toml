[build]
builder = "NIXPACKS"
# npm install (not npm ci): Railway's build cache mounts node_modules/.cache,
# and npm ci's wholesale node_modules removal hits EBUSY on that mount.
# The bundle step uses a pinned npx esbuild so it never depends on how
# npm classified esbuild (prod vs dev) in the cached node_modules.
buildCommand = "npm install --no-audit --no-fund && npx --yes esbuild@0.28.2 apps/api/src/index.ts --bundle --platform=node --format=esm --target=node22 --packages=external --alias:@wedding/shared=./packages/shared/src/index.ts --outfile=apps/api/dist/index.js --sourcemap"

[deploy]
startCommand = "npm run start -w @wedding/api"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
