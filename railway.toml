[build]
builder = "NIXPACKS"
# npm install (not npm ci): Railway's build cache mounts node_modules/.cache,
# and npm ci's wholesale node_modules removal hits EBUSY on that mount.
buildCommand = "npm install --no-audit --no-fund && npm run build -w @wedding/api"

[deploy]
startCommand = "npm run start -w @wedding/api"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
